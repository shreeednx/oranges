[build-system]
requires = ["setuptools>=77"]   # PEP 639 license fields
build-backend = "setuptools.build_meta"

[project]
name = "oranges"
version = "0.0.1"
description = "Static recompilation of the game to a native PC program"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"   # compression.zstd is in the standard library from 3.14
dependencies = ["lz4>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "capstone>=5", "numpy>=2"]   # capstone: disassembly while investigating; numpy: oranges.drive

[project.scripts]
oranges = "oranges.__main__:main"

[tool.setuptools]
packages = ["oranges"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["third_party"]   # vendored, kept as upstream wrote it

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]   # printf-style formatting is the house style

[tool.ruff.lint.per-file-ignores]
# oranges.kit puts the kit on sys.path, so it must be imported before the kit's modules
"oranges/{lift,lift_fixes,insncheck,build,hle,spin}.py" = ["I001"]
# ported from Longshot and kept close to it
"oranges/insn.py" = ["I001", "E501", "B007", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
